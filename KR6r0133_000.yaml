front:
  text: 古清涼傳序夫紫府名山七佛師棲真之處清涼聖境萬菩薩晦跡之方亘於古今備於圖籍芬馥之異華靈草瑩潔之幽石寒泉瑞氣吐於林中祥雲橫於嶺上蒼巖入夜炯炯而燈燭常明碧洞侵晨殷殷而鼓鐘恆響老人蕭散於溪谷童子游戲於烟霞燦燦之樓閣莊嚴巍巍之殿堂崇麗或則高僧遠訪或則貴族親臨觀化儀結得道之緣瞻相好發至誠之願修殊因於此日證妙果於他生恆覩玉毫之光常居金色之界其悟達者識心而見性其歸依者殄障而消災可謂福不唐捐功不虛棄編聯傳記流布寰區誘引顓愚咸深諦信齊登覺路俱造玄門同乘般若之舟共升涅槃之岸大定辛丑歲二月十七日永安崇壽禪院雪堂中隱沙門廣英謹序
